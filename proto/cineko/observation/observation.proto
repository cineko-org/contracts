edition = "2024";

package cineko.observation;

import "buf/validate/validate.proto";
import "cineko/catalog/catalog.proto";
import "cineko/collection/collection.proto";
import "cineko/common/common.proto";
import "cineko/seatmap/seatmap.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cineko-org/contracts/v3/gen/go/cineko/observation;observation";

message ScheduleCapture {}
message CatalogCapture {}
message SeatMapCapture {}
message SeatAvailabilityCapture {}

message Capability {
  oneof capability {
    option (buf.validate.oneof).required = true;

    ScheduleCapture schedule_capture = 1;
    CatalogCapture catalog_capture = 2;
    SeatMapCapture seat_map_capture = 3;
    SeatAvailabilityCapture seat_availability_capture = 4;
  }
}

message ScheduleTask {
  cineko.catalog.Theater theater = 1 [(buf.validate.field).required = true];
  string locale = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string time_zone = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message CatalogTask {
  string provider_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string locale = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string time_zone = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // The local Client supplies movies whose poster bytes are already cached.
  // Its embedded Probe aborts those image requests before they reach the
  // provider CDN.
  repeated string cached_poster_movie_ids = 4 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.max_items = 256,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

message SeatMapTask {
  option (buf.validate.message).cel = {
    id: "seat_map_task_theater_auditorium"
    message: "seat-map auditorium must belong to the target theater"
    expression: "this.theater.id == this.auditorium.theater_id"
  };

  cineko.catalog.Theater theater = 1 [(buf.validate.field).required = true];
  cineko.catalog.Auditorium auditorium = 2 [(buf.validate.field).required = true];
  string locale = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string time_zone = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message SeatAvailabilityTask {
  option (buf.validate.message).cel = {
    id: "seat_availability_task_theater_auditorium"
    message: "seat-availability auditorium must belong to the target theater"
    expression: "this.theater.id == this.auditorium.theater_id"
  };
  option (buf.validate.message).cel = {
    id: "seat_availability_task_showtime_target"
    message: "seat-availability showtime must belong to the target theater and auditorium"
    expression: "this.showtime.theater_id == this.theater.id && this.showtime.identity.cgv.site_no == this.auditorium.identity.cgv.site_no && this.showtime.identity.cgv.screen_no == this.auditorium.identity.cgv.screen_no"
  };

  cineko.catalog.Theater theater = 1 [(buf.validate.field).required = true];
  cineko.catalog.Auditorium auditorium = 2 [(buf.validate.field).required = true];
  cineko.catalog.Showtime showtime = 3 [(buf.validate.field).required = true];
  string locale = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string time_zone = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message AssignmentTask {
  cineko.common.EgressPolicy egress = 1 [(buf.validate.field).required = true];
  oneof task {
    option (buf.validate.oneof).required = true;

    ScheduleTask schedule = 2;
    CatalogTask catalog = 3;
    SeatMapTask seat_map = 4;
    SeatAvailabilityTask seat_availability = 5;
  }
}

message Capture {
  cineko.common.LocalDate target_date = 1;
  bool complete = 2;
  google.protobuf.Timestamp observed_at = 3;
  string error_code = 4;
  repeated cineko.catalog.Showtime showtimes = 5;
}

message ScheduleCaptures {
  repeated Capture captures = 1 [(buf.validate.field).repeated.min_items = 1];
}

message Completed {
  oneof payload {
    option (buf.validate.oneof).required = true;

    ScheduleCaptures schedule = 1;
    cineko.catalog.CatalogSnapshot catalog = 2;
    cineko.seatmap.Snapshot seat_map = 3;
    cineko.seatmap.LiveSeatObservation live_seat = 4;
  }
}

message Deferred {
  cineko.collection.DeferredReason reason = 1 [(buf.validate.field).required = true];
}

message Failed {
  cineko.collection.FailureReason reason = 1 [(buf.validate.field).required = true];
}

message AssignmentResult {
  option (buf.validate.message).cel = {
    id: "assignment_run_interval"
    message: "finished_at must be greater than or equal to started_at"
    expression: "this.finished_at >= this.started_at"
  };

  string run_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  google.protobuf.Timestamp started_at = 2 [(buf.validate.field).required = true];
  google.protobuf.Timestamp finished_at = 3 [(buf.validate.field).required = true];
  oneof outcome {
    option (buf.validate.oneof).required = true;

    Completed completed = 4;
    Deferred deferred = 5;
    Failed failed = 6;
  }
}

message ResultReceipt {
  string assignment_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string run_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string content_hash = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9a-f]{64}$"
  ];
  oneof disposition {
    option (buf.validate.oneof).required = true;

    Accepted accepted = 4;
    Duplicate duplicate = 5;
  }
}

message Accepted {}
message Duplicate {}
