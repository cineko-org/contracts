edition = "2024";

package cineko.catalog;

import "buf/validate/validate.proto";
import "cineko/common/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cineko-org/contracts/v3/gen/go/cineko/catalog;catalog";

message Provider {
  string id = 1;
  string name = 2;
}

message CgvTheaterIdentity {
  string site_no = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[0-9]+$"
  ];
}

message CgvMovieIdentity {
  string movie_no = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[0-9]+$"
  ];
}

message CgvAuditoriumIdentity {
  string site_no = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[0-9]+$"
  ];
  string screen_no = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[0-9]+$"
  ];
}

message CgvShowtimeIdentity {
  string site_no = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[0-9]+$"
  ];
  cineko.common.LocalDate schedule_date = 2 [(buf.validate.field).required = true];
  string screen_no = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[0-9]+$"
  ];
  string sequence = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[0-9]+$"
  ];
}

message TheaterIdentity {
  oneof provider {
    option (buf.validate.oneof).required = true;

    CgvTheaterIdentity cgv = 1;
  }
}

message MovieIdentity {
  oneof provider {
    option (buf.validate.oneof).required = true;

    CgvMovieIdentity cgv = 1;
  }
}

message AuditoriumIdentity {
  oneof provider {
    option (buf.validate.oneof).required = true;

    CgvAuditoriumIdentity cgv = 1;
  }
}

message ShowtimeIdentity {
  oneof provider {
    option (buf.validate.oneof).required = true;

    CgvShowtimeIdentity cgv = 1;
  }
}

message Theater {
  string id = 1;
  string provider_id = 2;
  TheaterIdentity identity = 3 [(buf.validate.field).required = true];
  string region = 4;
  string name = 5;
}

message Movie {
  string id = 1;
  string provider_id = 2;
  MovieIdentity identity = 3 [(buf.validate.field).required = true];
  string title = 4;
  string poster_url = 5;
}

message Auditorium {
  string id = 1;
  string theater_id = 2;
  AuditoriumIdentity identity = 3 [(buf.validate.field).required = true];
  string name = 4;
  repeated string screen_types = 5;
  int32 capacity = 6;
  string current_layout_hash = 7;
}

message Showtime {
  string id = 1;
  string provider_id = 2;
  ShowtimeIdentity identity = 3 [(buf.validate.field).required = true];
  string theater_id = 4;
  Movie movie = 5;
  Auditorium auditorium = 6;
  google.protobuf.Timestamp starts_at = 7 [(buf.validate.field).required = true];
  google.protobuf.Timestamp ends_at = 8 [(buf.validate.field).required = true];
  int32 available_seats = 9;
  int32 capacity = 10;
  bool sold_out = 11;
}

message CatalogSnapshot {
  Provider provider = 1;
  repeated Theater theaters = 2;
  repeated Movie movies = 3;
  repeated Auditorium auditoriums = 4;
  repeated Showtime showtimes = 5;
  google.protobuf.Timestamp observed_at = 6;
}

message CatalogIndex {
  int64 generation = 1;
  repeated Provider providers = 2;
  repeated Theater theaters = 3;
  repeated Movie movies = 4;
  repeated Auditorium auditoriums = 5;
  repeated Showtime showtimes = 6;
}
