name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: 1.71.0
          github_token: ${{ github.token }}
      - run: npm ci
      - run: make check

  release-metadata:
    if: ${{ startsWith(github.head_ref, 'release-please--') }}
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Validate generated release metadata
        run: bash scripts/verify-release-metadata.sh
